<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3f7a2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Flock Rescue</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game3d" class="hidden"></canvas>
      <canvas id="game"></canvas>

      <div id="hud" class="hidden">
        <div class="hud-top">
          <button id="pause" class="icon-btn" aria-label="Pause">❚❚</button>
          <div class="hud-mid">
            <div id="level-name"></div>
            <div class="progress"><div id="progress-fill"></div></div>
          </div>
          <div id="count" class="count">🐑 0</div>
        </div>
        <div id="banner" class="banner hidden"></div>
        <div id="hint" class="hint">Drag to move your dog.<br />Sheep run away from him.</div>
        <button id="bark" class="bark" aria-label="Bark"><span>BARK</span></button>
      </div>

      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
